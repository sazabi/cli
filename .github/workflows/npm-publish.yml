name: Publish to npm

# Channel-aware publish driven by the sazabi/gitops `public-cli` unit:
#   main         → dist-tag `latest` (production promote; main is the release mirror)
#   channel/dev  → dist-tag `dev`    (auto-published prerelease per monorepo release-graph merge)
#   channel/next → dist-tag `next`   (staging promote / soak channel)
#
# Publishing uses npm trusted publishing (OIDC) — no npm token exists anywhere.
# The gitops handler (sazabi/gitops scripts/deploy/public-cli.sh) pushes bundle
# content to the matching ref and waits for this workflow's conclusion, then
# verifies the dist-tag on the registry.

on:
  push:
    branches:
      - main
      - "channel/dev"
      - "channel/next"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

# Repo-level default: no permissions. Each job opts in explicitly.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Resolve dist-tag from ref
        id: channel
        run: |
          case "$GITHUB_REF_NAME" in
            main) dist_tag="latest" ;;
            channel/dev) dist_tag="dev" ;;
            channel/next) dist_tag="next" ;;
            *)
              echo "::error::Unsupported publish ref: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify dist/index.js exists
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::dist/index.js not found. The gitops handler must push this file before publishing."
            exit 1
          fi

      - name: Verify release-manifest.json exists
        run: |
          if [ ! -f release-manifest.json ]; then
            echo "::error::release-manifest.json not found. The gitops handler must push this file before publishing."
            exit 1
          fi

      - name: Verify distSha256 matches dist/index.js
        run: |
          MANIFEST_SHA=$(node -p "require('./release-manifest.json').distSha256")
          ACTUAL_SHA=$(sha256sum dist/index.js | awk '{print $1}')
          if [ "$MANIFEST_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA256 mismatch! Manifest: $MANIFEST_SHA, Actual: $ACTUAL_SHA"
            exit 1
          fi

      - name: Verify manifest version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./release-manifest.json').version")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) != release-manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Verify version matches the channel
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$DIST_TAG" in
            latest)
              if [[ "$PKG_VERSION" == *-* ]]; then
                echo "::error::latest must publish a bare semver, got prerelease $PKG_VERSION"
                exit 1
              fi
              ;;
            dev|next)
              if [[ "$PKG_VERSION" != *"-${DIST_TAG}."* ]]; then
                echo "::error::${DIST_TAG} channel requires a -${DIST_TAG}.* prerelease version, got $PKG_VERSION"
                exit 1
              fi
              ;;
          esac

      - name: Verify package metadata matches this repository
        run: |
          EXPECTED_REPOSITORY_URL="git+https://github.com/${GITHUB_REPOSITORY}.git"
          ACTUAL_REPOSITORY_URL=$(node -p "(() => { const repo = require('./package.json').repository; return typeof repo === 'string' ? repo : repo?.url || ''; })()")

          if [ "$ACTUAL_REPOSITORY_URL" != "$EXPECTED_REPOSITORY_URL" ]; then
            echo "::error::package.json repository.url must be ${EXPECTED_REPOSITORY_URL} for npm provenance/trusted publishing. Found ${ACTUAL_REPOSITORY_URL}"
            exit 1
          fi

      - name: Smoke test — version
        run: node dist/index.js --version

      - name: Smoke test — help
        run: node dist/index.js --help

      - name: Check if version is already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published. Ensuring dist-tag only."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.already_published == 'false'
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Rollback path: the version is already on the registry (an earlier SHA was
      # re-promoted), so only the dist-tag needs to move. As of the 2026-08-01
      # ENG-5188 drill, the registry REFUSES OIDC-exchanged credentials for
      # dist-tag writes (trusted publishing is publish-only), so this step is
      # expected to fail loudly with the manual repoint command until npm
      # extends OIDC scope or a granular token is provisioned. Automated
      # rollback is publish-forward: revert on main, bump, promote.
      - name: Repoint dist-tag (already-published version)
        if: steps.version-check.outputs.already_published == 'true'
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          PACKAGE_NAME: ${{ steps.version-check.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail

          current="$(npm view "$PACKAGE_NAME" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
          if [ "$current" = "$PACKAGE_VERSION" ]; then
            echo "dist-tag ${DIST_TAG} already points at ${PACKAGE_VERSION}; nothing to do."
            exit 0
          fi

          echo "Repointing ${DIST_TAG}: ${current:-<unset>} -> ${PACKAGE_VERSION}"

          id_token="$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
            | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).value")"

          # Package-scoped exchange, mirroring npm CLI's lib/utils/oidc.js:
          # POST /-/npm/v1/oidc/token/exchange/package/<escaped-name> with the
          # GitHub id_token as the bearer; response carries {token}.
          escaped_name="${PACKAGE_NAME/\//%2f}"
          exchange_body="$(curl -sS -X POST \
            -H "Authorization: Bearer ${id_token}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${escaped_name}")"
          exchanged="$(node -p "JSON.parse(process.argv[1]).token ?? ''" "$exchange_body" 2>/dev/null || true)"

          if [ -z "$exchanged" ]; then
            message="$(node -p "JSON.parse(process.argv[1]).message ?? 'no message'" "$exchange_body" 2>/dev/null || echo 'unparseable response')"
            echo "::error::OIDC token exchange for dist-tag repoint failed (${message}). Repoint manually: npm dist-tag add ${PACKAGE_NAME}@${PACKAGE_VERSION} ${DIST_TAG}"
            exit 1
          fi

          umask 077
          npmrc="$(mktemp)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$exchanged" > "$npmrc"
          if ! NPM_CONFIG_USERCONFIG="$npmrc" npm dist-tag add "${PACKAGE_NAME}@${PACKAGE_VERSION}" "$DIST_TAG"; then
            rm -f "$npmrc"
            echo "::error::Registry refused the exchanged credential for dist-tag writes (trusted publishing is publish-only). Repoint manually with an npm account that has publish rights: npm dist-tag add ${PACKAGE_NAME}@${PACKAGE_VERSION} ${DIST_TAG} — or roll back publish-forward (revert + bump + promote)."
            exit 1
          fi
          rm -f "$npmrc"

      - name: Verify dist-tag points at this version
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          PACKAGE_NAME: ${{ steps.version-check.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            resolved="$(npm view "$PACKAGE_NAME" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            if [ "$resolved" = "$PACKAGE_VERSION" ]; then
              echo "dist-tag ${DIST_TAG} -> ${PACKAGE_VERSION} confirmed."
              exit 0
            fi
            echo "Attempt ${attempt}: dist-tag ${DIST_TAG} is '${resolved:-<unset>}', expected ${PACKAGE_VERSION}; retrying..."
            sleep 10
          done
          echo "::error::dist-tag ${DIST_TAG} does not point at ${PACKAGE_VERSION} after publish."
          exit 1
